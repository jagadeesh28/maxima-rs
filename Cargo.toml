[workspace]
resolver = "2"
members = ["sym-core", "sym-macros", "maxima-rs", "tests", "maxima-web"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
egg = "0.9"
num-rational = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
winnow = "0.7"
thiserror = "2"
proptest = "1"
dashu-float = "0.4"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
panic = "unwind"
strip = true
codegen-units = 1

[package]
name = "maxima-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Compile-time symbolic math optimization via e-graph equality saturation"
keywords = ["symbolic", "mathematics", "optimization", "codegen", "macro"]
categories = ["mathematics", "compilers"]

[features]
default = ["full"]
full = ["diff", "egraph", "cse", "codegen", "parser", "pipeline", "macros", "tensor", "poly", "integrate", "series", "limit", "solve", "cas", "bfloat", "matrix", "complex", "specfn", "transform", "assume"]
tensor = ["sym-core/tensor"]
diff = ["sym-core/diff"]
egraph = ["sym-core/egraph"]
cse = ["sym-core/cse"]
codegen = ["sym-core/codegen"]
parser = ["sym-core/parser"]
pipeline = ["sym-core/pipeline"]
poly = ["sym-core/poly"]
integrate = ["sym-core/integrate"]
series = ["sym-core/series"]
limit = ["sym-core/limit"]
solve = ["sym-core/solve"]
cas = ["sym-core/cas"]
bfloat = ["sym-core/bfloat"]
matrix = ["sym-core/matrix"]
complex = ["sym-core/complex"]
specfn = ["sym-core/specfn"]
transform = ["sym-core/transform"]
assume = ["sym-core/assume"]
macros = ["dep:sym-macros", "diff", "egraph", "cse", "codegen"]

[dependencies]
sym-core = { path = "../sym-core", default-features = false }
sym-macros = { path = "../sym-macros", optional = true }

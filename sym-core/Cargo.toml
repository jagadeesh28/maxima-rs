[package]
name = "sym-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["full"]
full = ["diff", "egraph", "cse", "codegen", "parser", "pipeline", "tensor", "poly", "integrate"]
tensor = []
diff = []
egraph = ["dep:egg"]
cse = []
codegen = ["dep:proc-macro2", "dep:quote"]
parser = ["dep:winnow", "dep:thiserror"]
pipeline = ["diff", "egraph", "cse", "codegen"]
poly = []
integrate = ["poly", "diff"]

[dependencies]
num-rational = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
egg = { workspace = true, optional = true }
proc-macro2 = { workspace = true, optional = true }
quote = { workspace = true, optional = true }
winnow = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

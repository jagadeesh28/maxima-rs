[package]
name = "sym-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["full"]
full = ["diff", "egraph", "cse", "codegen", "parser", "pipeline", "tensor", "poly", "integrate", "series", "limit", "solve", "cas", "bfloat", "matrix", "complex", "specfn", "transform", "assume"]
tensor = []
diff = []
egraph = ["dep:egg"]
cse = []
codegen = ["dep:proc-macro2", "dep:quote"]
parser = ["dep:winnow", "dep:thiserror"]
pipeline = ["diff", "egraph", "cse", "codegen"]
poly = []
integrate = ["poly", "diff", "limit"]
series = ["poly", "diff"]
limit = ["series", "poly"]
solve = ["poly", "diff"]
cas = ["poly", "integrate", "series", "limit", "solve", "diff", "egraph"]
bfloat = ["dep:dashu-float"]
matrix = ["poly", "solve", "dep:thiserror"]
complex = ["poly", "series", "diff"]
specfn = ["diff", "poly"]
transform = ["diff", "poly", "solve", "specfn", "dep:thiserror"]
assume = ["dep:thiserror"]

[dependencies]
num-rational = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
dashu-float = { workspace = true, optional = true }
egg = { workspace = true, optional = true }
proc-macro2 = { workspace = true, optional = true }
quote = { workspace = true, optional = true }
winnow = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

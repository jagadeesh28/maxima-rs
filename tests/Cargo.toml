[package]
name = "maxima-tests"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
maxima-rs = { path = "../maxima-rs", features = ["full"] }
sym-core = { path = "../sym-core", features = ["full"] }
sym-macros = { path = "../sym-macros" }
maxima-web = { path = "../maxima-web" }
serde_json = "1"
proptest = { workspace = true }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["full"] }

